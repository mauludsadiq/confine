[package]
name = "confine-core"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of the confine protocol v2 canonical encoding, tagged hashing, and HMAC construction (spec sections 2-5)."

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[lib]
name = "confine_core"
path = "src/lib.rs"
